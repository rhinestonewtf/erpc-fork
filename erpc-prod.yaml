logLevel: warn
database:
  evmJsonRpcCache:
    connectors:
      - id: memory-cache
        driver: memory
    policies:
      - network: "*"
        method: "*"
        finality: realtime
        empty: allow
        connector: memory-cache
        ttl: 2s
server:
  httpHostV4: 0.0.0.0
  httpPortV4: 4000
  # listenV6: false
  # httpHostV6: "[::]"
  # httpPortV6: 5000
  maxTimeout: 50s
metrics:
  enabled: true
  hostV4: 0.0.0.0
  port: 4001
projects:
